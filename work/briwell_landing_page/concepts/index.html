<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briwell 랜딩 히어로 — 컨셉 3안 비교</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1A1D24; color: #EDF1F7; padding: 32px; }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .note { font-size: 13px; color: #8B95A7; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .card { background: #232833; border-radius: 12px; overflow: hidden; border: 1px solid rgba(139,149,167,0.2); }
    .card-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
    .card-title { font-size: 14px; font-weight: 600; }
    .card-title small { display: block; font-weight: 400; color: #8B95A7; margin-top: 2px; }
    .card a { font-size: 12px; color: #4FE3C1; text-decoration: none; white-space: nowrap; }
    .frame-wrap { width: 100%; aspect-ratio: 1280 / 860; overflow: hidden; position: relative; background: #fff; }
    .frame-wrap iframe {
      width: 1280px; height: 860px; border: 0;
      transform-origin: top left; position: absolute; top: 0; left: 0;
    }
  </style>
</head>
<body>
  <h1>Briwell 랜딩 히어로 — 컨셉 3안</h1>
  <p class="note">카드를 클릭하면 원본 크기로 열립니다. 데스크톱 1280px 기준 미리보기.</p>
  <div class="grid">
    <div class="card">
      <div class="card-head">
        <div class="card-title">A · 시스템/오퍼레이터<small>다크 · 대시보드 증거 중심</small></div>
        <a href="concept-a.html" target="_top">크게 보기 →</a>
      </div>
      <div class="frame-wrap"><iframe src="concept-a.html" scrolling="no"></iframe></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title">B · 클린 K-뷰티<small>라이트 · 감성 · 뷰티 브랜드 톤</small></div>
        <a href="concept-b.html" target="_top">크게 보기 →</a>
      </div>
      <div class="frame-wrap"><iframe src="concept-b.html" scrolling="no"></iframe></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title">C · 에디토리얼 하이브리드<small>라이트 · 매거진 + 시스템 증거</small></div>
        <a href="concept-c.html" target="_top">크게 보기 →</a>
      </div>
      <div class="frame-wrap"><iframe src="concept-c.html" scrolling="no"></iframe></div>
    </div>
  </div>
  <script>
    // scale each 1280px iframe to fit its card width
    function fit() {
      document.querySelectorAll('.frame-wrap').forEach(w => {
        const s = w.clientWidth / 1280;
        w.querySelector('iframe').style.transform = `scale(${s})`;
      });
    }
    fit();
    addEventListener('resize', fit);
  </script>
</body>
</html>
