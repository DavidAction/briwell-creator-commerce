<!DOCTYPE html><html><head><meta charset="UTF-8"></head>
<body style="margin:0;background:#fff;font:700 19px/1.7 Consolas,monospace;padding:16px">
<div id="out">measuring...</div><div id="host"></div>
<script>
const jobs = [["/index.html",1280],["/index.html",375],["/themes/t11-fandom.html",1280],["/themes/t11-fandom.html",375],["/themes/t09-playground.html",1280],["/themes/t09-playground.html",375],["/ir/index.html",1280],["/ir/index.html",375]];
const results = []; const host = document.getElementById("host");
function run(i) {
  if (i >= jobs.length) { document.getElementById("out").innerHTML = results.join("<br>") + "<br>DONE"; return; }
  const [n, w] = jobs[i];
  const f = document.createElement("iframe");
  f.src = n; f.style.cssText = `width:${w}px;height:1200px;border:0;position:absolute;left:-99999px`;
  f.onload = () => { setTimeout(() => {
    try { const d = f.contentDocument;
      const over = [...d.querySelectorAll("*")].filter(el => { const b = el.getBoundingClientRect(); return b.right > w + 1 && el.clientWidth > 0 && !el.closest(".marquee") && !el.closest(".ripples") && !el.closest(".prev-outer"); }).length;
      const bad = [...d.images].filter(im => !(im.complete && im.naturalWidth > 0)).length;
      results.push(`${n} ${w}: h=${d.documentElement.scrollHeight} over=${over} bad=${bad}`);
    } catch(e) { results.push(`${n} ${w}: ERR ` + e.message); }
    f.remove(); run(i + 1); }, 1100); };
  host.appendChild(f);
}
run(0);
</script>
</body></html>
