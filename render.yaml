# Render Blueprint for the Briwell API + managed PostgreSQL.
#
# Blueprint files are only detected at the repository root; the API itself
# lives in work/briwell_mvp_app (see rootDir). Deploy steps: docs/DEPLOY_RENDER.md.
#
# Every `sync: false` key must be filled in the Render dashboard before the
# first deploy — the preDeployCommand readiness gate fails closed (exit 1)
# until production config is complete, so a half-configured service never boots.

services:
  - type: web
    name: briwell-api
    runtime: python
    rootDir: work/briwell_mvp_app
    plan: starter
    region: virginia
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/verify_production_readiness.py --env-file .env.production && python scripts/bootstrap_db.py --with-seeds --with-keywords --verify
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      # Matches the locally verified interpreter. If Render's build rejects the
      # version, drop to the latest 3.13.x — the code needs only 3.10+ syntax.
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Briwell Influencer Intelligence
      - key: USE_DATABASE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: briwell-postgres
          property: connectionString
      - key: MANAGED_SECRET_PROVIDER
        value: render_environment
      - key: AUTH_PROVIDER
        value: oidc
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_AUDIENCE
        value: authenticated
      - key: OIDC_JWKS_URL
        sync: false
      - key: OIDC_ROLE_CLAIM
        value: app_metadata.briwell_role
      - key: OIDC_EMAIL_CLAIM
        value: email
      - key: OIDC_ALLOWED_ALGORITHMS
        value: ES256,RS256
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: AI_DRY_RUN
        value: "false"
      - key: ALLOW_LIVE_PROVIDER_CALLS
        value: "true"
      # --- Brand Partner Hub AI ingestion (briefing 0.0.21) ---
      # Provider-abstracted; default = Anthropic Claude Opus 4.8 (Fable 5
      # escalation via PARTNER_AI_ESCALATION_MODEL when opened). Ships in
      # dry-run — open the dual gate only after the golden-set accuracy check.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PARTNER_AI_PROVIDER
        value: anthropic
      - key: PARTNER_AI_MODEL
        value: claude-opus-4-8
      - key: PARTNER_AI_DRY_RUN
        value: "true"
      - key: ALLOW_LIVE_PARTNER_AI_CALLS
        value: "false"
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_TIKTOK_ACTOR_ID
        value: clockworks/tiktok-scraper
      - key: DATA365_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: TIKAPI_API_KEY
        sync: false
      # TikTok scrape lane ships OFF by default (compliance decision 2026-06-27:
      # provider_scrape is honestly labeled but live calls require an explicit,
      # recorded legal/ToS sign-off before re-enabling in any deployment).
      - key: TIKTOK_PROVIDER_DRY_RUN
        value: "true"
      - key: ALLOW_LIVE_TIKTOK_PROVIDER_CALLS
        value: "false"
      - key: TIKTOK_PROVIDER_DAILY_RESULT_LIMIT
        value: "2000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # In-app DB job worker (app lifespan starts it when USE_DATABASE is on).
      # Defaults to false in config for local dev; without this, queued analysis
      # jobs would sit unprocessed in production.
      - key: OUTBOX_WORKER_ENABLED
        value: "true"
      - key: BACKUP_RESTORE_TESTED_AT
        sync: false
      # --- Shopify integration (briefing 0.0.7; docs/SHOPIFY_GOLIVE.md) ---
      # Webhook receivers fail closed (503) until SHOPIFY_WEBHOOK_SECRET is set,
      # and discount issuance stays in dry-run until the dual gate below is
      # opened at go-live step 5. Safe to deploy before the Shopify store exists.
      - key: SHOPIFY_SHOP_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_API_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-01"
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_FX_RATES
        sync: false
      - key: SHOPIFY_DRY_RUN
        value: "true"
      - key: ALLOW_LIVE_SHOPIFY_CALLS
        value: "false"
      # Public Google News RSS market signals (discovery screen). Legal public
      # feed; live ON in production so the panel shows real headlines. Flip
      # NEWS_RSS_DRY_RUN back to true to fall back to labeled sample rows.
      - key: NEWS_RSS_DRY_RUN
        value: "false"
      - key: ALLOW_LIVE_NEWS_RSS_CALLS
        value: "true"

databases:
  # Managed Postgres for the pilot. basic-256mb (not free) because Render's
  # free Postgres expires after 30 days; fits the approved $80-140/mo budget.
  - name: briwell-postgres
    plan: basic-256mb
    region: virginia
    databaseName: briwell
    user: briwell
